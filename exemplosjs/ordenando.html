<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordenando Valores</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/ordenando.js" defer></script>
  <script>
    function renderizarLista(valores) {
      const lista = document.getElementById("valores");
      lista.innerHTML = valores.map(valor => `<li>${valor}</li>`).reduce((html, item) => html + item, "");
    }

    function add() {
      const campo = document.getElementById("valor");
      const lista = document.getElementById("valores");
      const numero = campo.value.trim();

      if (numero === "" || !Number.isInteger(Number(numero))) {
        campo.focus();
        campo.setCustomValidity("Digite um número inteiro.");
        campo.reportValidity();
        campo.setCustomValidity("");
        return;
      }

      const node = document.createElement("li");
      const texto = document.createTextNode(String(Number(numero)));
      node.appendChild(texto);
      lista.appendChild(node);
      campo.value = "";
      campo.focus();
    }

    function ordenar() {
      const lista = document.getElementById("valores");
      const selecao = document.getElementById("algoritmo");
      const vetor = Array.from(lista.children).map(item => parseInt(item.innerHTML, 10));

      if (selecao.selectedIndex === 0) {
        bubble_sort(vetor);
      } else if (selecao.selectedIndex === 1) {
        selection_sort(vetor);
      } else {
        quick_sort(vetor, 0, vetor.length - 1);
      }

      renderizarLista(vetor);
    }

    function misturar() {
      const lista = document.getElementById("valores");
      const vetor = Array.from(lista.children).map(item => parseInt(item.innerHTML, 10));
      shuffle(vetor, Math.max(vetor.length * 2, 1));
      renderizarLista(vetor);
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("valor").addEventListener("keydown", evento => {
        if (evento.key === "Enter") add();
      });
    });
  </script>
</head>
<body class="bg-light">
  <main class="container py-5">
    <a href="index.html" class="text-decoration-none">← Início</a>
    <div class="row justify-content-center mt-3">
      <div class="col-lg-7">
        <section class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4">Ordenando Valores</h1>
            <label for="valor" class="form-label">Valor</label>
            <div class="input-group mb-3">
              <input type="number" step="1" class="form-control" id="valor" placeholder="Digite um número inteiro">
              <button class="btn btn-primary" type="button" onclick="add()">Adicionar</button>
            </div>
            <label for="algoritmo" class="form-label">Algoritmo de ordenação</label>
            <select class="form-select mb-3" id="algoritmo">
              <option>Bubble Sort</option>
              <option>Selection Sort</option>
              <option>Quick Sort</option>
            </select>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-primary" type="button" onclick="ordenar()">Ordenar</button>
              <button class="btn btn-outline-primary" type="button" onclick="misturar()">Misturar</button>
              <button class="btn btn-outline-secondary ms-auto" type="button" onclick="document.getElementById('valores').innerHTML = ''">Limpar</button>
            </div>
            <hr>
            <ul id="valores" class="mb-0"></ul>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
