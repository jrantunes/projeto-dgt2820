<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários de Teste via REST</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>
  <script src="js/usuarios.js" defer></script>
</head>
<body class="container bg-warning py-4">
  <a href="index.html" class="text-dark text-decoration-none">← Início</a>
  <main id="usuarios" class="container-fluid mt-3">
    <h1 class="h2 mb-2">Usuários de Teste via REST</h1>
    <p class="text-dark">Os usuários deste exemplo são fornecidos pela API de testes <a href="https://reqres.in/" target="_blank" rel="noopener">reqres.in</a>.</p>
    <div v-if="loading" class="alert alert-info" role="status">Carregando usuários...</div>
    <div v-if="error" class="alert alert-warning" role="alert">{{ error }}</div>
    <div class="row">
      <div class="col-md-4 p-2" v-for="(user,index) in users" :key="index">
        <div class="card h-100 shadow-sm">
          <img :src="user.avatar" class="card-img-top avatar-usuario" :alt="'Foto de ' + user.first_name">
          <div class="card-body">
            <h2 class="card-title h5">{{ user.first_name }} {{ user.last_name }}</h2>
            <p class="card-text mb-0">{{ user.email }}</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
